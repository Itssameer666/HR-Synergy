<!DOCTYPE html>
<html lang="en" th:replace="~{admin/adminbase :: layout(~{::main})}">
<body>
<main>
    <div class="row justify-content-center">
        <div class="col-12 col-lg-9">
            <!-- Header Card -->
            <div class="dash-card p-4 mb-4">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                    <div>
                        <div class="d-flex align-items-center gap-2 mb-1">
                            <span class="badge bg-primary-subtle text-primary fw-semibold px-2 py-1 rounded-pill small">
                                <i class="ti ti-plus"></i> Recruitment
                            </span>
                        </div>
                        <h3 class="fw-bold text-dark mb-1">Publish New Job Vacancy</h3>
                        <p class="text-muted small mb-0">Fill in the role specifications, salary, location, and application deadline.</p>
                    </div>
                    <div class="d-flex gap-2">
                        <a href="/admin/postedjob" class="btn btn-sm btn-dash-secondary">
                            <i class="ti ti-list"></i> View All Postings
                        </a>
                        <a href="/admin/admindashboard" class="btn btn-sm btn-dash-secondary">
                            <i class="ti ti-arrow-left"></i> Dashboard
                        </a>
                    </div>
                </div>
            </div>

            <!-- Success / Alert Message -->
            <div th:if="${msg}" class="alert alert-success alert-dismissible fade show d-flex align-items-center gap-2 mb-4" role="alert">
                <i class="ti ti-circle-check fs-4 text-success"></i>
                <div class="flex-grow-1">
                    <span th:text="${msg}">Job posting saved successfully.</span>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Modern Form Card -->
            <div class="dash-card">
                <div class="dash-card-header">
                    <h5 class="dash-card-title">
                        <i class="ti ti-briefcase text-primary fs-5"></i> Vacancy Details & Requirements
                    </h5>
                </div>
                <div class="dash-card-body p-4">
                    <form method="post" th:object="${jdto}">
                        <div class="row g-3">
                            <!-- Job Title -->
                            <div class="col-12 col-md-8">
                                <label class="form-label fw-semibold text-dark">Job Title / Role <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white text-muted">
                                        <i class="ti ti-briefcase"></i>
                                    </span>
                                    <input type="text" th:field="${jdto.title}" class="form-control" placeholder="e.g. Senior Java Full Stack Developer" required>
                                </div>
                            </div>

                            <!-- Job Type -->
                            <div class="col-12 col-md-4">
                                <label class="form-label fw-semibold text-dark">Employment Type <span class="text-danger">*</span></label>
                                <select class="form-select" th:field="${jdto.jobtype}" required>
                                    <option value="Full time">Full Time</option>
                                    <option value="Part time">Part Time</option>
                                    <option value="Internship">Internship</option>
                                </select>
                            </div>

                            <!-- Location -->
                            <div class="col-12 col-md-6">
                                <label class="form-label fw-semibold text-dark">Job Location <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white text-muted">
                                        <i class="ti ti-map-pin"></i>
                                    </span>
                                    <input type="text" th:field="${jdto.location}" class="form-control" placeholder="e.g. Bengaluru / Remote" required>
                                </div>
                            </div>

                            <!-- Salary -->
                            <div class="col-12 col-md-6">
                                <label class="form-label fw-semibold text-dark">Monthly Salary (INR ₹) <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white text-muted">
                                        <i class="ti ti-currency-rupee"></i>
                                    </span>
                                    <input type="number" th:field="${jdto.salary}" class="form-control" placeholder="e.g. 50000" min="0" required>
                                </div>
                            </div>

                            <!-- Last Date -->
                            <div class="col-12 col-md-6">
                                <label class="form-label fw-semibold text-dark">Application Deadline <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white text-muted">
                                        <i class="ti ti-calendar"></i>
                                    </span>
                                    <input type="date" th:field="${jdto.lastdate}" class="form-control" required>
                                </div>
                            </div>

                            <!-- Description -->
                            <div class="col-12">
                                <label class="form-label fw-semibold text-dark">Job Description & Responsibilities <span class="text-danger">*</span></label>
                                <textarea th:field="${jdto.description}" class="form-control" rows="5" placeholder="Specify role responsibilities, required qualifications, technical skill sets, and company benefits..." required></textarea>
                                <small class="text-muted">This description will be shown directly to prospective candidates on the job board.</small>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="d-flex justify-content-end gap-2 pt-4 mt-3 border-top">
                            <button type="reset" class="btn btn-outline-secondary rounded-pill px-4">
                                Reset
                            </button>
                            <button type="submit" class="btn btn-primary rounded-pill px-4 shadow-sm">
                                <i class="ti ti-send me-1"></i> Publish Job Vacancy
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
