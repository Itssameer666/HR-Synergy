<html lang="en" th:replace="~{admin/adminbase :: layout(~{::main})}">
<body>
 <main>
 	<h1>View All Feedbacks</h1>
 	<div th:if="${msg}">
 	<p th:text="${msg}" style="color:red;text-align:center;"></p>
 	</div>
 	<hr/>
 	<table class="table table-boreded" style="margin:auto;width:90%;">
 	
 	<tr>
 	<th>Id</th>
 	<th>Name</th>
 	<th>Contact No</th>
 	<th>Subject</th>
 	<th>Feedback</th>
 	<th>Posted Date</th>
 	<th>Delete</th>
 	</tr>
 	<tr th:each="f:${feed}">
 	<td th:text="${f.id}"></td>
 	<td th:text="${f.name}"></td>
 	<td th:text="${f.contactno}"></td>
 	<td th:text="${f.subject}"></td>
 	<td th:text="${f.responsetext}"></td>
 	<td th:text="${f.posteddate}"></td>
 	<td>
 	<a th:href="@{/admin/deletefeed(id=${f.id})}" class="btn btn-danger btn-sm">
 	Delete
 	</a>
 	</td>
 	</tr>
 	</table>
 </main>
</body>
</html>
