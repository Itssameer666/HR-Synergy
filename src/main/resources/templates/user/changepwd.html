<!DOCTYPE html>
<html lang="en" th:replace="~{user/userbase :: layout(~{::main})}">
<body>
<main>
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <!-- Header Card -->
            <div class="dash-card p-4 mb-4">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="d-flex align-items-center gap-2 mb-1">
                            <span class="badge bg-primary-subtle text-primary fw-semibold px-2 py-1 rounded-pill small">
                                <i class="ti ti-key"></i> Candidate Security
                            </span>
                        </div>
                        <h4 class="fw-bold text-dark mb-0">Change Password</h4>
                    </div>
                    <a href="/user/userdash" class="btn btn-sm btn-dash-secondary">
                        <i class="ti ti-arrow-left"></i> Dashboard
                    </a>
                </div>
            </div>

            <!-- Error / Notification Message -->
            <div th:if="${msg}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center gap-2 mb-4" role="alert">
                <i class="ti ti-alert-circle fs-4 text-danger"></i>
                <div class="flex-grow-1">
                    <span th:text="${msg}">Password update notification.</span>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Password Form Card -->
            <div class="dash-card">
                <div class="dash-card-header">
                    <h5 class="dash-card-title">
                        <i class="ti ti-lock text-success fs-5"></i> Update Your Credentials
                    </h5>
                </div>
                <div class="dash-card-body p-4">
                    <form method="post" action="/user/changepwd">
                        <!-- Current Password -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-dark">Current / Old Password <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-white text-muted">
                                    <i class="ti ti-lock"></i>
                                </span>
                                <input type="password" name="oldpassword" class="form-control" placeholder="Enter current account password" required>
                            </div>
                        </div>

                        <!-- New Password -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-dark">New Password <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-white text-muted">
                                    <i class="ti ti-key"></i>
                                </span>
                                <input type="password" name="newpassword" class="form-control" placeholder="Create strong new password" required>
                            </div>
                        </div>

                        <!-- Confirm New Password -->
                        <div class="mb-4">
                            <label class="form-label fw-semibold text-dark">Confirm New Password <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-white text-muted">
                                    <i class="ti ti-shield-check"></i>
                                </span>
                                <input type="password" name="confirmpassword" class="form-control" placeholder="Re-enter new password" required>
                            </div>
                        </div>

                        <!-- Security Notice -->
                        <div class="p-3 bg-light rounded-3 mb-4 border">
                            <small class="text-muted d-block mb-1">
                                <i class="ti ti-info-circle text-primary me-1"></i> <strong>Security Reminder:</strong>
                            </small>
                            <small class="text-muted d-block">
                                Changing your password will require you to log in again on your next session.
                            </small>
                        </div>

                        <!-- Submit Button -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success rounded-pill py-2 shadow-sm fw-semibold">
                                <i class="ti ti-check me-1"></i> Update Password & Sign Out
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
