<!DOCTYPE html>
<html lang="en" th:replace="~{user/userbase :: layout(~{::main})}">
<body>
<main>
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <!-- Header Card -->
            <div class="dash-card p-4 mb-4">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                    <div>
                        <div class="d-flex align-items-center gap-2 mb-1">
                            <span class="badge bg-primary-subtle text-primary fw-semibold px-2 py-1 rounded-pill small">
                                <i class="ti ti-message-dots"></i> Candidate Desk
                            </span>
                        </div>
                        <h3 class="fw-bold text-dark mb-1">Candidate Feedback & Grievances</h3>
                        <p class="text-muted small mb-0">Share your interview experience, queries, or submit issues directly to HR administration.</p>
                    </div>
                    <div>
                        <a href="/user/userdash" class="btn btn-sm btn-dash-secondary">
                            <i class="ti ti-arrow-left"></i> Dashboard
                        </a>
                    </div>
                </div>
            </div>

            <!-- Success / Status Alert -->
            <div th:if="${msg}" class="alert alert-success alert-dismissible fade show d-flex align-items-center gap-2 mb-4" role="alert">
                <i class="ti ti-circle-check fs-4 text-success"></i>
                <div class="flex-grow-1">
                    <strong class="d-block">Submission Received!</strong>
                    <span th:text="${msg}">Your response is submitted.</span>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Form Card -->
            <div class="dash-card">
                <div class="dash-card-header">
                    <h5 class="dash-card-title">
                        <i class="ti ti-edit text-success fs-5"></i> Response Details
                    </h5>
                </div>
                <div class="dash-card-body p-4">
                    <form method="post" th:object="${rdto}" action="/user/giveresponse">
                        <!-- Response Type -->
                        <div class="mb-4">
                            <label class="form-label fw-semibold text-dark">Select Inquiry Category <span class="text-danger">*</span></label>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <div class="form-check p-3 rounded-3 border bg-light">
                                        <input class="form-check-input ms-0 me-2" type="radio" th:field="${rdto.responsetype}" value="feedback" id="typeFeedback" checked>
                                        <label class="form-check-label fw-medium text-dark" for="typeFeedback">
                                            <i class="ti ti-thumb-up text-success me-1"></i> Positive Feedback / Suggestion
                                        </label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-check p-3 rounded-3 border bg-light">
                                        <input class="form-check-input ms-0 me-2" type="radio" th:field="${rdto.responsetype}" value="complaint" id="typeComplaint">
                                        <label class="form-check-label fw-medium text-dark" for="typeComplaint">
                                            <i class="ti ti-alert-triangle text-warning me-1"></i> Issue / Grievance Report
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Subject Field -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-dark">Subject <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-white text-muted">
                                    <i class="ti ti-heading"></i>
                                </span>
                                <input type="text" th:field="${rdto.subject}" class="form-control" placeholder="Brief summary of your topic or query..." required>
                            </div>
                        </div>

                        <!-- Message Field -->
                        <div class="mb-4">
                            <label class="form-label fw-semibold text-dark">Detailed Message <span class="text-danger">*</span></label>
                            <textarea th:field="${rdto.responsetext}" class="form-control" rows="5" placeholder="Provide full context, job title, or specific incident details..." required></textarea>
                            <div class="form-text text-muted small">Our HR operations team typically responds within 24-48 business hours.</div>
                        </div>

                        <!-- Submit Button -->
                        <div class="d-flex justify-content-end gap-2 pt-2 border-top">
                            <button type="reset" class="btn btn-outline-secondary rounded-pill px-4">
                                Reset
                            </button>
                            <button type="submit" class="btn btn-success rounded-pill px-4 shadow-sm">
                                <i class="ti ti-send me-1"></i> Submit Response
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
